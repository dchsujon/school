    <style>
      @media print {
        body * {
          visibility: hidden;
        }
        #print-result-card, #print-result-card *, 
        #print-invoice-receipt, #print-invoice-receipt * {
          visibility: visible;
        }
        #print-result-card, #print-invoice-receipt {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 0; /* Changed from 1rem to 0 to avoid layout issues */
          box-shadow: none !important;
          border: none !important;
        }
        .no-print {
          display: none !important;
        }
        .print-page-break {
          page-break-after: always;
          border: none !important; /* Hide dashed line on print */
        }
      }
    </style>
