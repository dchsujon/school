name: Build Panjabi Wholesale Android APK

on:
  push:
    branches:
      - android-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build Firebase FCM APK
        run: gradle assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/panjabi-wholesale-v1.0.4-fcm.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: panjabi-wholesale-android-v1.0.4-fcm
          path: android-app/dist/*.apk
